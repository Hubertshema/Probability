<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experimental vs Theoretical Probability</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes flipAnim { 0% { transform: rotateY(0deg) scale(1); } 50% { transform: rotateY(90deg) scale(1.1); } 100% { transform: rotateY(0deg) scale(1); } }
        @keyframes rollAnim { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
        .anim-flip { animation: flipAnim 0.2s ease-in-out; }
        .anim-roll { animation: rollAnim 0.2s ease-in-out; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-2 md:p-6 flex flex-col items-center h-screen overflow-hidden">
    <a href="index.html" id="back-btn" class="absolute top-4 left-4 bg-slate-200 text-slate-700 px-3 py-1 rounded hover:bg-slate-300 transition text-sm font-semibold flex items-center gap-2 z-50">&larr; Back to Dashboard</a>
    <script>
        try { if (window.self !== window.top) document.getElementById('back-btn').style.display = 'none'; } 
        catch (e) { document.getElementById('back-btn').style.display = 'none'; }
    </script>
    <div class="w-full text-center mb-2 md:mb-4 flex-shrink-0">
        <h1 class="text-xl md:text-3xl font-bold text-slate-800 mb-1">Experimental Probability Simulator</h1>
        <p class="text-xs md:text-sm text-slate-500">Compare experimental outcomes to theoretical probabilities as the number of trials increases.</p>
    </div>

    <div class="max-w-6xl w-full grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-8 flex-1 min-h-0">
        
        <!-- COIN SIMULATOR -->
        <div class="bg-white p-4 md:p-6 rounded-xl shadow-lg border border-slate-200 flex flex-col h-full min-h-0">
            <div class="flex justify-between items-center mb-3 md:mb-6 flex-shrink-0">
                <h2 class="text-xl md:text-2xl font-bold text-blue-600">Coin Toss</h2>
                <div id="coin-visual" class="w-16 h-16 bg-gradient-to-br from-yellow-300 to-yellow-500 rounded-full flex items-center justify-center text-3xl font-black text-yellow-900 shadow-inner border-4 border-yellow-400">H</div>
            </div>
            
            <div class="flex flex-wrap gap-2 mb-6">
                <button onclick="flipCoin(1)" class="flex-1 bg-blue-100 text-blue-700 px-3 py-2 rounded font-semibold hover:bg-blue-200 transition">Flip 1x</button>
                <button onclick="flipCoin(10)" class="flex-1 bg-blue-100 text-blue-700 px-3 py-2 rounded font-semibold hover:bg-blue-200 transition">Flip 10x</button>
                <button onclick="flipCoin(100)" class="flex-1 bg-blue-100 text-blue-700 px-3 py-2 rounded font-semibold hover:bg-blue-200 transition">Flip 100x</button>
                <button onclick="flipCoin(1000)" class="flex-1 bg-blue-600 text-white px-3 py-2 rounded font-semibold hover:bg-blue-700 transition shadow">Flip 1,000x</button>
            </div>
            <div class="grid grid-cols-3 gap-4 mb-6 text-center flex-shrink-0">
                <div class="bg-slate-100 p-3 rounded-lg">
                    <div class="text-xs text-slate-500 uppercase tracking-wide">Flips</div>
                    <div id="total-flips" class="text-xl font-bold text-slate-800">0</div>
                </div>
                <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                    <div class="text-xs text-blue-500 uppercase tracking-wide">Heads</div>
                    <div id="heads-count" class="text-xl font-bold text-blue-700">0</div>
                </div>
                <div class="bg-slate-100 p-3 rounded-lg">
                    <div class="text-xs text-slate-500 uppercase tracking-wide">Tails</div>
                    <div id="tails-count" class="text-xl font-bold text-slate-600">0</div>
                </div>
            </div>

            <div class="mt-auto">
                <div class="flex justify-between items-end text-sm text-slate-600 mb-1">
                    <span>P(Heads): <strong id="prob-heads" class="text-blue-600 text-lg">0.000</strong></span>
                    <span class="text-xs">Theoretical: 0.5</span>
                </div>
                <div class="relative w-full h-8 bg-slate-200 rounded overflow-hidden mb-4">
                    <div class="absolute top-0 bottom-0 left-1/2 w-0.5 bg-slate-800 z-10"></div>
                    <div id="prob-bar" class="absolute top-0 bottom-0 left-0 bg-blue-500 transition-all duration-300 w-0"></div>
                </div>
                <div class="flex gap-2">
                    <button onclick="exportCoin()" class="flex-1 bg-blue-50 text-blue-600 border border-blue-200 px-4 py-2 rounded font-semibold hover:bg-blue-100 transition">Export to Excel</button>
                    <button onclick="resetCoin()" class="flex-1 bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded font-semibold hover:bg-red-100 transition">Reset Coin</button>
                </div>
            </div>
        </div>

        <!-- DICE SIMULATOR -->
        <div class="bg-white p-4 md:p-6 rounded-xl shadow-lg border border-slate-200 flex flex-col h-full min-h-0">
            <div class="flex justify-between items-center mb-3 md:mb-6 flex-shrink-0">
                <h2 class="text-xl md:text-2xl font-bold text-emerald-600">Die Roll</h2>
                <div id="die-visual" class="w-16 h-16 bg-white rounded-xl flex items-center justify-center text-5xl shadow-md border-2 border-slate-200 text-slate-800 leading-none pb-1">&#x2680;</div>
            </div>
            
            <div class="flex flex-wrap gap-2 mb-6">
                <button onclick="rollDice(1)" class="flex-1 bg-emerald-100 text-emerald-700 px-3 py-2 rounded font-semibold hover:bg-emerald-200 transition">Roll 1x</button>
                <button onclick="rollDice(10)" class="flex-1 bg-emerald-100 text-emerald-700 px-3 py-2 rounded font-semibold hover:bg-emerald-200 transition">Roll 10x</button>
                <button onclick="rollDice(100)" class="flex-1 bg-emerald-100 text-emerald-700 px-3 py-2 rounded font-semibold hover:bg-emerald-200 transition">Roll 100x</button>
                <button onclick="rollDice(1000)" class="flex-1 bg-emerald-600 text-white px-3 py-2 rounded font-semibold hover:bg-emerald-700 transition shadow">Roll 1,000x</button>
            </div>

            <div class="flex justify-between items-end text-sm text-slate-600 mb-2">
                <span>Total Rolls: <strong id="total-rolls" class="text-slate-800 text-lg">0</strong></span>
                <span class="text-xs">Theoretical P(any side) ≈ 16.67%</span>
            </div>

            <div class="space-y-2 md:space-y-3 mb-4 overflow-y-auto flex-1 min-h-0 pr-2">
                <!-- Generates bars for 1-6 -->
                <script>
                    for(let i=1; i<=6; i++) {
                        document.write(`
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-slate-500 w-4">${i}</span>
                                <div class="relative flex-1 h-5 bg-slate-100 rounded overflow-hidden border border-slate-200">
                                    <div class="absolute top-0 bottom-0 left-[16.67%] w-0.5 bg-emerald-800 z-10 opacity-50"></div>
                                    <div id="dice-bar-${i}" class="absolute top-0 bottom-0 left-0 bg-emerald-400 transition-all duration-300 w-0"></div>
                                </div>
                                <span id="dice-pct-${i}" class="text-xs font-mono w-12 text-right text-slate-600">0.0%</span>
                            </div>
                        `);
                    }
                </script>
            </div>

            <div class="mt-auto">
                <div class="flex gap-2">
                    <button onclick="exportDice()" class="flex-1 bg-emerald-50 text-emerald-600 border border-emerald-200 px-4 py-2 rounded font-semibold hover:bg-emerald-100 transition">Export to Excel</button>
                    <button onclick="resetDice()" class="flex-1 bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded font-semibold hover:bg-red-100 transition">Reset Die</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- COIN LOGIC ---
        let heads = 0, tails = 0, coinTotal = 0;

        function flipCoin(times) {
            let lastFlip = '';
            for(let i=0; i<times; i++) {
                if(Math.random() < 0.5) { heads++; lastFlip = 'H'; }
                else { tails++; lastFlip = 'T'; }
            }
            coinTotal += times;
            
            const visual = document.getElementById('coin-visual');
            visual.innerText = lastFlip;
            visual.classList.remove('anim-flip');
            void visual.offsetWidth; // trigger reflow
            visual.classList.add('anim-flip');
            
            updateCoinUI();
        }

        function resetCoin() {
            heads = 0; tails = 0; coinTotal = 0;
            document.getElementById('coin-visual').innerText = 'H';
            updateCoinUI();
        }

        function updateCoinUI() {
            document.getElementById('total-flips').innerText = coinTotal;
            document.getElementById('heads-count').innerText = heads;
            document.getElementById('tails-count').innerText = tails;
            
            let pHeads = coinTotal === 0 ? 0 : heads / coinTotal;
            document.getElementById('prob-heads').innerText = pHeads.toFixed(3);
            document.getElementById('prob-bar').style.width = (pHeads * 100) + '%';
        }

        // --- DICE LOGIC ---
        let diceTotal = 0;
        let diceCounts = [0, 0, 0, 0, 0, 0];
        const diceFaces = ['&#x2680;', '&#x2681;', '&#x2682;', '&#x2683;', '&#x2684;', '&#x2685;']; // Unicode dice 1-6

        function rollDice(times) {
            let lastRoll = 0;
            for(let i=0; i<times; i++) {
                lastRoll = Math.floor(Math.random() * 6);
                diceCounts[lastRoll]++;
            }
            diceTotal += times;
            
            const visual = document.getElementById('die-visual');
            visual.innerHTML = diceFaces[lastRoll];
            visual.classList.remove('anim-roll');
            void visual.offsetWidth; // trigger reflow
            visual.classList.add('anim-roll');
            
            updateDiceUI();
        }

        function resetDice() {
            diceTotal = 0;
            diceCounts = [0, 0, 0, 0, 0, 0];
            document.getElementById('die-visual').innerHTML = diceFaces[0];
            updateDiceUI();
        }

        function updateDiceUI() {
            document.getElementById('total-rolls').innerText = diceTotal;
            
            for(let i=0; i<6; i++) {
                let prob = diceTotal === 0 ? 0 : (diceCounts[i] / diceTotal) * 100;
                document.getElementById(`dice-bar-${i+1}`).style.width = prob + '%';
                document.getElementById(`dice-pct-${i+1}`).innerText = prob.toFixed(1) + '%';
            }
        }

        function exportCoin() {
            let prob = coinTotal === 0 ? 0 : (heads / coinTotal);
            let html = `
            <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
            <head><style>
                table { border-collapse: collapse; width: 100%; font-family: Arial, sans-serif; }
                th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
                th { background-color: #f8fafc; color: #1e293b; font-weight: bold; }
                .title { background-color: #3b82f6; color: white; font-size: 16px; font-weight: bold; }
                .highlight { background-color: #eff6ff; font-weight: bold; color: #1d4ed8; }
            </style></head>
            <body>
                <table>
                    <tr><th colspan="2" class="title">Coin Toss Simulation Results</th></tr>
                    <tr><th>Metric</th><th>Value</th></tr>
                    <tr><td>Total Flips</td><td>${coinTotal}</td></tr>
                    <tr><td>Heads Count</td><td>${heads}</td></tr>
                    <tr><td>Tails Count</td><td>${coinTotal - heads}</td></tr>
                    <tr><th colspan="2">Probabilities</th></tr>
                    <tr><td>Experimental P(Heads)</td><td class="highlight">${prob.toFixed(4)}</td></tr>
                    <tr><td>Theoretical P(Heads)</td><td>0.5000</td></tr>
                </table>
            </body></html>`;
            
            let blob = new Blob([html], { type: 'application/vnd.ms-excel' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'Coin_Simulation.xls';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function exportDice() {
            let html = `
            <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
            <head><style>
                table { border-collapse: collapse; width: 100%; font-family: Arial, sans-serif; }
                th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
                th { background-color: #f8fafc; color: #1e293b; font-weight: bold; }
                .title { background-color: #10b981; color: white; font-size: 16px; font-weight: bold; }
                .highlight { background-color: #ecfdf5; font-weight: bold; color: #047857; }
            </style></head>
            <body>
                <table>
                    <tr><th colspan="3" class="title">Die Roll Simulation Results</th></tr>
                    <tr><th colspan="3">Total Rolls: ${diceTotal}</th></tr>
                    <tr><th>Die Face</th><th>Count</th><th>Experimental Probability</th></tr>`;
            
            for(let i=0; i<6; i++) {
                let prob = diceTotal === 0 ? 0 : (diceCounts[i] / diceTotal);
                html += `<tr>
                            <td>${i+1}</td>
                            <td>${diceCounts[i]}</td>
                            <td class="highlight">${(prob * 100).toFixed(2)}%</td>
                         </tr>`;
            }
            
            html += `
                    <tr><th colspan="3">Theoretical P(any side) ≈ 16.67%</th></tr>
                </table>
            </body></html>`;
            
            let blob = new Blob([html], { type: 'application/vnd.ms-excel' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'Dice_Simulation.xls';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
